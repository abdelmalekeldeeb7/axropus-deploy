# H200 Qwen3.6-27B AMF smoke benchmark.
#
# This is the practical H200 path after DeepSeek V4 Flash proved too
# operationally heavy for a clean single-GPU AMF benchmark.
# All traffic is synthetic.

model: /home/jovyan/models/Qwen3.6-27B
requests: 64
seed: 20260602
output_dir: benchmark_results/h200_qwen36_27b_amf_smoke_64req

traffic:
  reusable_prefixes: 16
  unique_fraction: 0.20
  zipf_alpha: 1.15
  hot_rank_cutoff: 4
  suffix_tokens: 64
  prefix_length_mix:
    - name: short
      weight: 0.20
      min_tokens: 2048
      max_tokens: 4096
    - name: medium
      weight: 0.60
      min_tokens: 8192
      max_tokens: 12288
    - name: long
      weight: 0.20
      min_tokens: 14336
      max_tokens: 16384

runtime:
  max_tokens: 1
  temperature: 0.0
  max_model_len: 18432
  gpu_memory_utilization: 0.90
  enforce_eager: true
  kv_cache_dtype: auto
  gpu_dollars_per_hour: 3.0

cache:
  budget_fractions: [1.0]
  kv_bytes_per_token: null
  min_kv_cache_memory_mb: 4096
  # Same-total-GPU-memory smoke:
  # APC gets 24 GB vLLM KV.
  # AMF gets 8 GB vLLM KV + 16 GB AMF raw VRAM tier.
  arm_kv_cache_memory_mb:
    apc: 24576
    lmcache: 8192
    amf: 8192
    amf_lmcache: 8192

lmcache:
  local_cpu_gb: 32
  chunk_size: 256
  save_unfull_chunk: true
  discard_partial_chunks: false
  skip_last_n_tokens: 0
  role: kv_both

amf:
  path_root: /tmp/korith-h200-qwen36-27b-amf-smoke
  vram_cache_gb: 16
  compressed_pool_gb: 0
  compressed_quant: int4
  sync_save: true
  save_unique_prefixes: true

correctness:
  sample_fraction: 0.10
  max_checks: 4
  fail_on_mismatch: true

disruptions:
  restart:
    enabled: true
    interval_requests: 32
    recovery_window_requests: 6
  eviction_to_zero:
    enabled: true
    interval_requests: 24
    recovery_window_requests: 4
    flood_multiplier: 1.25
  cold_routing:
    enabled: true
    fleet_size: 8
    recovery_window_requests: 1

verify:
  enabled: true
  speedup_threshold: 1.3
  max_recomputed_fraction: 0.10
  fail_on_verify_fail: true
