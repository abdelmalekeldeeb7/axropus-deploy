global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "korith-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "korith-router"
    metrics_path: /metrics
    static_configs:
      - targets: ["router:8000"]

  - job_name: "korith-worker-gpu0"
    metrics_path: /metrics
    static_configs:
      - targets: ["worker-gpu0:9000"]
